# Fixed light-mode palette, included from the generated
# ~/.cache/wallpaper/kitty-colors.conf when the wallpaper theme is light.
# background / cursor come from the wallpaper theme; do not set them here.
#
# Vivid OKLCH palette modelled on the old wallpaper-generated one, but with
# fixed hues: ANSI 1-6 at hues 27/145/62/258/330/205 (yellow shifted toward
# rust/amber, it goes olive otherwise), normal (L .52, C .20), bright = deeper
# (L .45, C .20), pushed to the sRGB gamut edge, computed with
# wallpaper.py's lch_hex (gamut-mapped) and checked >= 4.5:1 against
# lch(0.95, 0.01, h) backgrounds for all hues.
# Neutrals are low-chroma (<= 0.012) cool greys at hue 265.

foreground              #1D1F24
selection_foreground    #F3F5F9
selection_background    #685ACB
url_color               #0062D4

# Window borders
active_border_color     #0062D4
inactive_border_color   #989FAB
bell_border_color       #B37900

# Tab bar
active_tab_foreground   #F3F5F9
active_tab_background   #0062D4
inactive_tab_foreground #575B62
inactive_tab_background #CDD1D9
tab_bar_background      #D7DBE3

# Marks
mark1_foreground #F3F5F9
mark1_background #0062D4
mark2_foreground #F3F5F9
mark2_background #7A4ABA
mark3_foreground #F3F5F9
mark3_background #007781

# black ("black" is the faint tone, "white" the text tone in light mode)
color0  #E1E5ED
color8  #C7CBD3
# red
color1  #C2181D
color9  #A3000F
# green
color2  #007E1F
color10 #006818
# yellow
color3  #985600
color11 #804300
# blue
color4  #0062D4
color12 #0050AF
# magenta
color5  #A32B9E
color13 #8C0888
# cyan
color6  #007781
color14 #006169
# white
color7  #575B62
color15 #1D1F23
