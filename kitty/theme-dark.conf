# Fixed dark-mode palette, included from the generated
# ~/.cache/wallpaper/kitty-colors.conf when the wallpaper theme is dark.
# background / cursor come from the wallpaper theme; do not set them here.
#
# Vivid OKLCH palette modelled on the old wallpaper-generated one, but with
# fixed hues: ANSI 1-6 at hues 27/145/88/258/330/205, normal (L .66, C .22),
# bright (L .75, C .20; red L .71 C .21 h 22 so it stays red, not salmon),
# pushed to the sRGB gamut edge (saturated, not pastel), computed with
# wallpaper.py's lch_hex (gamut-mapped) and checked >= 4.5:1 against
# lch(0.17, 0.01, h) backgrounds for all hues.
# Neutrals are low-chroma (<= 0.012) cool greys at hue 265.

foreground              #E8EBF2
selection_foreground    #F3F5F9
selection_background    #503EAD
url_color               #4390FF

# Window borders
active_border_color     #4390FF
inactive_border_color   #3F4249
bell_border_color       #EAB532

# Tab bar
active_tab_foreground   #0D0F14
active_tab_background   #4390FF
inactive_tab_foreground #7A808D
inactive_tab_background #24262C
tab_bar_background      #181B20

# Marks
