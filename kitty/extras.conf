# Optional quality-of-life tweaks, included from kitty.conf.
# Comment out `include extras.conf` there to revert all of them at once.
# Colours are not set here: they come from theme-<mode>.conf.

# Breathing room around text and slightly taller lines
window_padding_width 6 8
modify_font cell_height 105%

# Beam cursor without blinking, with a short trail when it jumps
cursor_shape beam
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Quiet: no audio bell, no flash; urgent hint for the WM instead
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes

# Close without asking (shells keep their own history)
confirm_os_window_close 0

# Bigger scrollback, plus a pager buffer for ctrl+shift+h (MB)
scrollback_lines 10000
scrollback_pager_history_size 32

# Clipboard: copy selections, drop trailing blanks from plain-text copies
copy_on_select yes
strip_trailing_spaces smart

# Links: curly underline, open on ctrl+click via default open_actions
url_style curly
detect_urls yes

# Tab bar at the bottom, powerline-slanted; shown only with 2+ tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# Hyprland draws borders and manages the window; no client decorations
hide_window_decorations yes

# Layouts cycled with ctrl+shift+l
enabled_layouts splits,tall,fat,stack

# New window / tab in the current directory
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t     launch --type=tab --cwd=current
