# hypridle: idle locking and screen blanking (services.hypridle in home.nix
# runs it in the graphical session; restart it after editing:
# systemctl --user restart hypridle).
# Locking goes through the Quickshell lock screen (quickshell/lock) over IPC;
# lock() is a no-op while already locked. Hyprland uses the Lua config, so
# dispatchers are Lua expressions.

general {
    # Also run on `loginctl lock-session`.
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = qs ipc call lock lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Delay suspend until the compositor reports the session as locked.
    inhibit_sleep = 3
}

# Lock after 10 minutes.
listener {
    timeout = 600
    on-timeout = qs ipc call lock lock
}

# Screens off a minute later; back on at the first input.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
